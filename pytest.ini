[pytest]
# Collect only the real test suite.
#
# test_email.py in the repository root is a MANUAL SMTP diagnostic, not a
# test: importing it sends a real email through the configured Gmail account
# and calls sys.exit(1). It matches pytest's default `test_*.py` pattern, so
# without this setting a bare `pytest` run would mail the project owner and
# abort collection. Run it deliberately with `python test_email.py` instead.
testpaths = tests

# Keep the security suite honest: an unraised/unknown marker or a typo'd
# fixture should fail the run rather than silently skip a security check.
addopts = -q --strict-markers --strict-config
filterwarnings =
    ignore::DeprecationWarning
