services:
  - type: web
    name: athletixai
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: FLASK_DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: DB_PATH
        value: /var/data/athletixai.db
    disk:
      name: athletix-data
      mountPath: /var/data
      sizeGB: 1
